name: Scheduled scrape

on:
  schedule:
    # Every 6 hours at :17 (well under SAM.gov 1,000/day quota)
    - cron: '17 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run scraper
        run: npm run scrape

      - name: Run SAM.gov opportunities scraper
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: npm run scrape:opps

      - name: Commit changes
        id: commit
        run: |
          git config user.name  "Nandan Hegde"
          git config user.email "37264314+Nandanhegde1@users.noreply.github.com"
          if [[ -n "$(git status --porcelain src/data/)" ]]; then
            git add src/data/
            git commit -m "chore(data): scheduled scrape $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & deploy to Cloudflare (skips until CLOUDFLARE_API_TOKEN secret is set)
        if: steps.commit.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "CLOUDFLARE_API_TOKEN repo secret not set — skipping deploy. Add it (Workers Scripts:Edit scope) to publish fresh data automatically."
            exit 0
          fi
          npm run build
          npx wrangler deploy
