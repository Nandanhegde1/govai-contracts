name: Scheduled scrape

on:
  schedule:
    # Every 6 hours at :17. A full SAM.gov run makes up to 110 requests (see scrape-opportunities.ts).
    - cron: '17 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run scraper
        run: npm run scrape

      # A SAM.gov failure must not block the USAspending data from publishing,
      # so this step continues on error and the run is failed at the end instead.
      # A throttle (free-tier quota) exits 0 with a ::warning:: annotation.
      - name: Run SAM.gov opportunities scraper
        id: sam
        continue-on-error: true
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: npm run scrape:opps

      # Verify BEFORE publishing: fresh data must not break retrieval quality.
      - name: Retrieval eval gate
        run: npm run ask:eval

      # Data that breaks `astro build` must never reach main: Cloudflare Workers
      # Builds deploys every push, and a failed deploy only shows as a check.
      - name: Build gate
        run: npm run build

      - name: Commit changes
        id: commit
        run: |
          git config user.name  "Nandan Hegde"
          git config user.email "37264314+Nandanhegde1@users.noreply.github.com"
          if [[ -n "$(git status --porcelain src/data/)" ]]; then
            git add src/data/
            git commit -m "chore(data): scheduled scrape $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # No deploy step: Cloudflare Workers Builds (git integration) builds and
      # deploys every push to main, including this commit.

      - name: Fail the run if the SAM.gov scraper failed
        if: steps.sam.outcome == 'failure'
        run: |
          echo "::error::SAM.gov opportunities scraper failed; see the 'Run SAM.gov opportunities scraper' step log."
          exit 1

      # Close the open failure issue once a run is clean, so the next outage
      # opens a fresh issue (and a fresh notification) instead of one more
      # comment on an old thread. Must stay after the SAM.gov check above.
      - name: Close the failure issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Scheduled scrape failed" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment "Recovered at $(date -u '+%Y-%m-%d %H:%M UTC'), [run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          fi

      - name: Open or update a failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Scheduled scrape failed" --json number --jq '.[0].number // empty')
          body="Scheduled scrape failed at $(date -u '+%Y-%m-%d %H:%M UTC') — [run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Scheduled scrape failed" --assignee Nandanhegde1 --body "$body"
          fi
