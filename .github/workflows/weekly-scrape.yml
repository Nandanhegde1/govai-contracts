name: Scheduled scrape

on:
  schedule:
    # Every 6 hours at :17 (well under SAM.gov 1,000/day quota)
    - cron: '17 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run scraper
        run: npm run scrape

      - name: Run SAM.gov opportunities scraper
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: npm run scrape:opps

      - name: Commit changes
        run: |
          git config user.name  "Nandan Hegde"
          git config user.email "103625898+NandanHegde10@users.noreply.github.com"
          if [[ -n "$(git status --porcelain src/data/)" ]]; then
            git add src/data/
            git commit -m "chore(data): weekly scrape $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes."
          fi
