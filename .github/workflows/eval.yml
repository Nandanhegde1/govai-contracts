name: Retrieval eval

on:
  push:
    branches: [main]
    paths: ['ask/**', 'src/data/contracts.json', 'package*.json']
  pull_request:
    paths: ['ask/**', 'src/data/contracts.json', 'package*.json']
  workflow_dispatch: {}

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Key-free deterministic gate: BM25 + router recall@8 against the frozen
      # gold set. Fails the build if recall drops below the measured 12/13 floor.
      - run: npm run ask:eval
